[pytest]
# ---------------------------------------------------------------------------
# 为什么需要这个文件（2026-10-02）
#
# 背景：本项目由 AI agent 协作开发，迭代速度取决于「改一行等多久才知道对不对」。
# 此前完整测试套件 629 项、串行约 260 秒，且**必须用 pytest 跑**：
# tests/conftest.py 的数据隔离依赖 pytest 钩子，用 `unittest discover` 会绕过隔离、
# 把测试数据写进正式 data/ 目录，并产生大量假失败。
#
# 提速手段（按收益排序）：
#   1) 只跑相关文件：`pytest tests/test_x.py`            → 1~10 秒
#   2) 静态检查代替跑测试：`ruff check .`                → 0.1 秒
#   3) 需要全量时加并行：`pytest tests -n auto`          → 显著快于串行
# 注意：marker 只是分类标签，**不会**自动排除测试；要跳过得显式 `-m "not slow"`。
# ---------------------------------------------------------------------------

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    -ra
    --strict-markers
    --durations=10
    -p no:cacheprovider

markers =
    slow: 单个或整文件耗时较长（进程隔离、真实等待、外部 IO）。用 `-m "not slow"` 跳过。
    integration: 跨模块集成（多条链路串起来），比纯单元慢但仍以 mock 为主。
    network: 需要真实外部服务/网络（默认应被跳过，除非显式指定）。
    vision: 涉及视觉模型调用路径。

# 说明：conftest.py 的 pytest_configure 会把 EDU_DATA_DIR 指向独立测试目录
# （默认 D:\项目\RAG\git_text_test_data），并把 VISION_MIN_IMAGE_BYTES 设为 0
# 以便合成小图仍能走识图分支。这两点都不应被本文件覆盖。
