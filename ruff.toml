# ---------------------------------------------------------------------------
# ruff 配置（2026-10-02）
#
# 目的：给 AI 协作者一个**秒级**的反馈回路，专门拦截「会导致运行期崩溃」的低级错误。
#
# 背景：本项目由 AI agent 协作开发。此前没有任何静态检查，于是
#   「函数里用了 os 却忘记 import os」这类错误只能靠跑完整测试套件（约 260 秒）
#   才能暴露，直接把一次迭代从秒级拖到 5 分钟。
#
# 设计取舍：**故意只开"真 bug"类规则**。
# 全量默认规则在本仓库产出 984 条风格建议（UP006/UP045/I001…），
# 噪声太大无法作为门禁，也没人会在意。风格统一应由 formatter 另行处理，
# 不应占用 agent 的注意力预算。
#
# 用法：
#   python -m ruff check .            # 检查
#   python -m ruff check . --fix      # 自动修可修的
# ---------------------------------------------------------------------------

target-version = "py312"
line-length = 110

exclude = [
    "venv",
    ".venv",
    "node_modules",
    "dist",
    "__pycache__",
    ".git",
    "data",
    "logs",
    "models",
]

[lint]
# 只保留「会崩 / 会掩盖错误」的规则，保证门禁干净可执行（当前约 25 条，都是真问题）。
# 风格类规则（UP*/I*/RUF*）刻意不开：本仓库能产出 984 条，噪声太大。
# F401（未使用导入）目前有 150 条历史存量，作为**独立清理任务**处理，
# 不纳入门禁，否则"红灯常亮"等于没有门禁。
select = [
    "F821",  # 未定义名 —— 就是「用了 os 没 import」这类直接崩的 bug
    "F811",  # 重复定义（后者静默覆盖前者）
    "F841",  # 赋值了从未使用的变量（常暴露漏调用的函数）
    "E722",  # 裸 except（会吞掉 KeyboardInterrupt/SystemExit）
]

[lint.per-file-ignores]
# 测试里常有意保留未使用变量作为说明，且 mock 场景多
"tests/**" = ["F841"]

[lint.isort]
# 未启用 isort 规则，这里仅占位说明：风格整理请用 `ruff format`，不要混入 bug 修复的 diff。
known-first-party = ["api", "config", "rag", "services", "utils"]
